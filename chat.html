<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - FindMe</title>
<style>
:root {
    --pink-main: #ff4fa3;
    --pink-light: #ffe6f3;
    --gray-bg: #f7f7fa;
    --white: #fff;
    --text-dark: #333;
}
body {
    margin:0; font-family: 'Poppins', sans-serif; background: var(--gray-bg);
}
header {
    background: var(--pink-main); color:white; padding:15px; font-size:18px;
}
#chatWindow {
    height: calc(100vh - 120px); 
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.message {
    max-width: 70%;
    padding: 10px;
    border-radius: 10px;
}
.message.sent { background: var(--pink-main); color:white; align-self: flex-end; }
.message.received { background: var(--white); color: var(--text-dark); align-self: flex-start; }
#chatForm {
    display: flex;
    gap: 10px;
    padding: 10px;
    background: var(--white);
    position: sticky;
    bottom: 0;
}
#chatForm input { flex:1; padding:10px; border-radius: 20px; border:1px solid #ddd; outline:none; }
#chatForm button { padding:10px 15px; border:none; border-radius: 20px; background: var(--pink-main); color:white; cursor:pointer; }
</style>
</head>
<body>

<header id="chatHeader">Chat</header>

<div id="chatWindow"></div>

<form id="chatForm">
    <input type="text" id="messageInput" placeholder="Tulis pesan...">
    <button type="submit">Kirim</button>
</form>

<script>
// Ambil username dari query string
const urlParams = new URLSearchParams(window.location.search);
const chatUser = urlParams.get('user') || 'User';
document.getElementById('chatHeader').innerText = "Chat dengan " + chatUser;

const chatWindow = document.getElementById('chatWindow');
const messageInput = document.getElementById('messageInput');
const chatForm = document.getElementById('chatForm');

// Ambil chat dari localStorage
let chatKey = "chat_" + chatUser;
let chatHistory = JSON.parse(localStorage.getItem(chatKey)) || [];

// Tampilkan chat
function renderChat() {
    chatWindow.innerHTML = '';
    chatHistory.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'message ' + msg.type;
        div.innerText = msg.text;
        chatWindow.appendChild(div);
    });
    chatWindow.scrollTop = chatWindow.scrollHeight;
}
renderChat();

// Kirim pesan
chatForm.addEventListener('submit', function(e){
    e.preventDefault();
    const text = messageInput.value.trim();
    if(text==='') return;

    chatHistory.push({type:'sent', text:text});
    localStorage.setItem(chatKey, JSON.stringify(chatHistory));
    renderChat();
    messageInput.value = '';

    // Simulasi balasan otomatis
    setTimeout(()=> {
        chatHistory.push({type:'received', text:'Terima kasih, pesan diterima!'});
        localStorage.setItem(chatKey, JSON.stringify(chatHistory));
        renderChat();
    }, 800);
});
</script>

</body>
</html>
