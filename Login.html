<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMe | Login</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe6f3, #f0fff0);
    }

    .login-container {
        background: #fff;
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
        position: relative;
    }

    .login-container img {
        width: 80px;
        margin-bottom: 20px;
    }

    .login-container h2 {
        color: #ff4fa3;
        margin-bottom: 25px;
        font-weight: 700;
    }

    .login-container input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .login-container button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 10px;
        border: none;
        background: #ff4fa3;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-container button:hover {
        background: #ff7fc2;
    }

    .login-container .show-password {
        margin-top: 10px;
        font-size: 14px;
        color: #ff4fa3;
        cursor: pointer;
        user-select: none;
    }

    .login-container .links {
        margin-top: 15px;
        font-size: 14px;
        display: flex;
        justify-content: space-between;
    }

    .login-container .links a {
        text-decoration: none;
        color: #ff4fa3;
        transition: 0.3s;
    }

    .login-container .links a:hover {
        color: #ff7fc2;
    }

    @media(max-width: 500px){
        .login-container {
            padding: 30px 20px;
        }
    }
</style>
</head>
<body>

<div class="login-container">
    <!-- Ilustrasi bisa diganti -->
    <img src="gambar3.png" alt="Illustration">
    <h2>Login FindMe</h2>

    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <div class="show-password" onclick="togglePassword()">Tampilkan Password</div>
        <button type="submit">Login</button>
    </form>

    <div class="links">
        <a href="#">Lupa Password?</a>
        <a href="DaftarAkun.html">Daftar Akun</a>
    </div>
</div>

<script>
    const form = document.getElementById('loginForm');

    form.addEventListener('submit', function(e){
        e.preventDefault(); // jangan reload page

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if(email === "" || password === ""){
            alert('Mohon isi email dan password.');
            return;
        }

        // LOGIN BERHASIL → masuk ke home
        alert('Selamat datang, ' + email + '!');
        window.location.href = "home.html";
    });
    
    function togglePassword(){
        const passInput = document.getElementById('password');
        passInput.type = passInput.type === "password" ? "text" : "password";
    }
</script>

</body>
</html>
