<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMe | Daftar Akun</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffe6f3, #f0fff0);
    }

    .register-container {
        background: #fff;
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 400px;
        text-align: center;
        position: relative;
    }

    .register-container h2 {
        color: #ff4fa3;
        margin-bottom: 25px;
        font-weight: 700;
    }

    .register-container input {
        width: 100%;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .register-container button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border-radius: 10px;
        border: none;
        background: #ff4fa3;
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    .register-container button:hover {
        background: #ff7fc2;
    }

    .register-container .links {
        margin-top: 15px;
        font-size: 14px;
    }

    .register-container .links a {
        color: #ff4fa3;
        text-decoration: none;
        transition: 0.3s;
    }

    .register-container .links a:hover {
        color: #ff7fc2;
    }

    .register-container .show-password {
        margin-top: 10px;
        font-size: 14px;
        color: #ff4fa3;
        cursor: pointer;
        user-select: none;
    }
</style>
</head>
<body>

<div class="register-container">
    <h2>Daftar Akun Admin FindMe</h2>

    <form id="registerForm">
        <input type="text" id="name" placeholder="Nama Lengkap" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" required>
        <div class="show-password" onclick="togglePassword()">Tampilkan Password</div>
        <button type="submit">Daftar</button>
    </form>

    <div class="links">
        Sudah punya akun? <a href="LoginAdmin.html">Login di sini</a>
    </div>
</div>

<script>
    const registerForm = document.getElementById('registerForm');

    registerForm.addEventListener('submit', function(e){
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if(password !== confirmPassword){
            alert("Password dan konfirmasi password tidak sama!");
            return;
        }

        if(name && email && password){
            alert(`Akun berhasil dibuat!\nNama: ${name}\nEmail: ${email}`);
            registerForm.reset();
            window.location.href = "login.html"; // langsung ke halaman login
        } else {
            alert("Mohon lengkapi semua field.");
        }
    });

    function togglePassword(){
        const passInput = document.getElementById('password');
        const confirmPassInput = document.getElementById('confirmPassword');
        if(passInput.type === "password"){
            passInput.type = "text";
            confirmPassInput.type = "text";
        } else {
            passInput.type = "password";
            confirmPassInput.type = "password";
        }
    }
</script>

</body>
</html>
