<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Daftar Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --pink-main: #ff4fa3;
    --white: #fff;
    --gray-bg: #f7f7fa;
    --dark: #333;
}

body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: var(--gray-bg);
}

/* NAVBAR CHAT */
.navbar-chat {
    background: var(--white);
    padding: 15px 20px;
    font-size: 20px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 5px rgba(0,0,0,.1);
    color: var(--pink-main);
}

/* LIST CHAT */
.chat-list {
    padding: 15px;
}

.chat-item {
    display: flex;
    align-items: center;
    background: var(--white);
    padding: 12px;
    border-radius: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.chat-item:hover {
    background: #ffe6f3;
}

.chat-item img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 12px;
}

.chat-info {
    flex: 1;
}

.chat-info .name {
    font-weight: 600;
    font-size: 16px;
}

.chat-info .last-msg {
    font-size: 13px;
    color: #666;
}

.chat-time {
    font-size: 12px;
    color: #888;
}
</style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar-chat">Chat</div>

<!-- LIST CHAT -->
<div class="chat-list" id="chatList">

    <!-- Contoh chat item -->
    <div class="chat-item" onclick="openChat('Abdul Malik')">
        <img src="profil2.png">
        <div class="chat-info">
            <div class="name">Abdul Malik</div>
            <div class="last-msg">Oke, nanti saya kabari lagi ya...</div>
        </div>
        <div class="chat-time">12.30</div>
    </div>

    <div class="chat-item" onclick="openChat('Rina Aprilia')">
        <img src="profil.png">
        <div class="chat-info">
            <div class="name">Aprilia</div>
            <div class="last-msg">Makasih banyak yaa 🙏</div>
        </div>
        <div class="chat-time">Kemarin</div>
    </div>

</div>

<script>
function openChat(name) {
    // Pindah ke halaman chat pribadi
    window.location.href = "chat.html?user=" + encodeURIComponent(name);
}
</script>

</body>
</html>
